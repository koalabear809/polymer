[package]
name = "polymer"
version = "0.1.0"
description = "A buffer-centric, live-redefinable editing environment"
edition = "2021"
license = "MIT"

[lib]
name = "polymer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9.0"
alacritty_terminal = "0.26.0"
tiny_http = "0.12"
getrandom = "0.3"
